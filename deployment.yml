apiVersion: apps/v1
kind: Deployment
metadata:
  name: hit-deployment
  namespace: test
  labels:
    app: hit
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: hit
  template:
    metadata:
      labels:
        app: hit
    spec:
      containers:
        - name: medusa
          image: docker.io/sdmoradi/hit-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-svc
  namespace: test
  labels:
    app: hit
spec:
  type: ClusterIP
  selector:
    app: hit
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medusa-ing
  namespace: test
spec:
  ingressClassName: nginx
  rules:
    - host: medusa.172.31.58.10.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medusa-svc
                port:
                  number: 5000
