apiVersion: v1
kind: ConfigMap
metadata:
  name: client-ip-histogram
  namespace: elk
data:
  saved-objects.ndjson: |
    {"type":"index-pattern","id":"filebeat-*","attributes":{"title":"filebeat-*","timeFieldName":"@timestamp"}}
    {"type":"visualization","id":"client-ip-count","attributes":{"title":"Requests by client IP","visState":"{\"title\":\"Requests by client IP\",\"type\":\"histogram\",\"params\":{\"type\":\"histogram\",\"grid\":{\"categoryLines\":false},\"categoryAxes\":[{\"id\":\"CategoryAxis-1\",\"type\":\"category\",\"position\":\"bottom\",\"show\":true,\"style\":{},\"scale\":{\"type\":\"linear\"},\"labels\":{\"show\":true,\"truncate\":100},\"title\":{\"text\":\"Client IP\"}}],\"valueAxes\":[{\"id\":\"ValueAxis-1\",\"name\":\"LeftAxis-1\",\"type\":\"value\",\"position\":\"left\",\"show\":true,\"scale\":{\"type\":\"linear\",\"mode\":\"normal\"},\"labels\":{\"show\":true,\"rotate\":0,\"filter\":false,\"truncate\":100},\"title\":{\"text\":\"Request count\"}}],\"seriesParams\":[{\"show\":true,\"type\":\"histogram\",\"mode\":\"normal\",\"data\":{\"label\":\"Count\",\"id\":\"1\"},\"drawLinesBetweenPoints\":true,\"showCircles\":true}],\"addTooltip\":true,\"addLegend\":false,\"legendPosition\":\"right\",\"times\":[],\"addTimeMarker\":false},\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"schema\":\"metric\",\"params\":{}},{\"id\":\"2\",\"enabled\":true,\"type\":\"terms\",\"schema\":\"segment\",\"params\":{\"field\":\"client_ip.keyword\",\"order\":\"desc\",\"orderBy\":\"1\",\"size\":10,\"otherBucket\":false,\"otherBucketLabel\":\"Other\",\"missingBucket\":false,\"missingBucketLabel\":\"Missing\"}}]}","uiStateJSON":"{}","description":"Top client IP addresses by request count","version":1,"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"filebeat-*\",\"query\":{\"language\":\"kuery\",\"query\":\"service_name : medusa\"},\"filter\":[]}"}},"references":[{"name":"kibanaSavedObjectMeta.searchSourceJSON.index","type":"index-pattern","id":"filebeat-*"}]}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: client-ip-histogram-import
  namespace: elk
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: client-ip-histogram-import
    spec:
      restartPolicy: OnFailure
      containers:
        - name: import-saved-objects
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until curl --fail --silent http://kibana:5601/api/status >/dev/null; do
                echo "Waiting for Kibana..."
                sleep 5
              done
              curl --fail --show-error --silent \
                -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
                -H "kbn-xsrf: true" \
                -F "file=@/saved-objects.ndjson"
          volumeMounts:
            - name: saved-objects
              mountPath: /saved-objects.ndjson
              subPath: saved-objects.ndjson
              readOnly: true
      volumes:
        - name: saved-objects
          configMap:
            name: client-ip-histogram
